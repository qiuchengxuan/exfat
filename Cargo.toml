[package]
name = "embedded-exfat"
version = "0.4.0"
edition = "2024"
authors = ["qiuchengxuan <qiuchengxuan@gmail.com>"]
repository = "https://github.com/qiuchengxuan/exfat"
keywords = ["fat", "exfat", "filesystem", "no_std", "async"]
categories = ["filesystem"]
license = "MIT"
description = "ExFAT filesystem library with async support, mainly focusing on embedded system"

[package.metadata.cargo-fc]
exclude_feature_sets = [["smol", "tokio"], ["async", "std"]]
exclude_features = ["extern-datetime-now", "default"]

[dependencies]
bitfield = "0.19"
chrono = { version = "0.4", optional = true, default-features = false }
derive_more = { version = "2.0", features = ["display", "from", "into"], default-features = false }
displaydoc = { version = "0.2", default-features = false }
heapless = "0.9"
hex-literal = "1.1"
log = { version = "0.4", optional = true }
maybe-async = { version = "0.2", features = ["is_sync"] }
memoffset = "0.9"
smol = { version = "2.0", optional = true }
spin = "0.10"
thiserror = { version = "2.0", default-features = false }
tokio = { version = "1.47", optional = true, features = ["fs", "io-std", "io-util", "rt", "sync"] }

[dev-dependencies]
log = "0.4"
test-log = "0.2.18"

[features]
async = []
std = ["chrono/std", "chrono/clock", "thiserror/std", "derive_more/std", "displaydoc/std"]
sync = []
default = ["std"]
extern-datetime-now = []
logging = ["dep:log"]
max-filename-size-30 = []
tokio = ["dep:tokio", "async", "std"]
smol = ["dep:smol", "async", "std"]

[lib]
name = "exfat"
doctest = false
